image: node:22

default:
  interruptible: true
  timeout: 5 minutes

stages:
  - test

# GitLab is a mirror of the nostr repo. It runs tests on its own runner; the
# nsite deploy lives in .ngit/act/workflows/deploy-nsite.yml and runs on the
# ngit-ci coordinator. Nothing is hosted on GitLab.
test:
  stage: test
  script:
    - npm run test
